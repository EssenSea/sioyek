name: CMake Build & Contract Tests

# ---------------------------------------------------------------------------
# CI environment / version checks log (kept for maintenance reference)
#
# [1] Node.js runtime
#     GitHub deprecated Node.js 20 on Actions runners. Use actions/checkout@v5
#     (current major, supported Node runtime) to avoid the deprecation warning.
#     Checked on: 2026-09-24.
#
# [2] Qt version
#     ubuntu-24.04 ships Qt 6.4.2, but the project requires Qt6 >= 6.5
#     (source uses QT_VERSION_CHECK(6,5,0)/(6,6,0)). Install Qt 6.7.2 explicitly
#     via jurplel/install-qt-action@v4 (same as the upstream qmake CI).
#
# [3] mupdf for the system route
#     ubuntu-24.04 ships mupdf 1.23.10, below the contract's verified minimum
#     (1.26.11). The system-mupdf route is therefore not exercised by a real
#     build in CI; its decision matrix is covered by the contract tests instead.
#     The vendored route (default) is fully built.
#
# [4] Windows / MSVC
#     `windows-release` / `windows-debug` were declared presets that no workflow
#     ever exercised (the release pipelines still call the legacy qmake
#     `build_windows.bat`). `windows-cmake-validate` now checks the Windows CMake
#     path: the Visual Studio generator is Windows-only, so this is the only
#     place the Windows configure step can be validated at all.
#
#     The *vendored* mupdf route is not MSVC-buildable: mupdf's Windows build is
#     a Visual Studio solution (mupdf/platform/win32/mupdf.sln), not the POSIX
#     Makefile this CMake build drives. SioyekMupdf.cmake therefore fails fast at
#     configure time with an actionable message; the job asserts that message.
#     A real Windows binary from the CMake path still needs a system/prebuilt
#     mupdf (SIOYEK_USE_SYSTEM_MUPDF=ON or the legacy qmake path).
# ---------------------------------------------------------------------------

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Fast: contract regression tests (self-contained, no submodules, no full build).
  # Verifies the dependency-source decision matrices, install contract, presets,
  # and CTest registration.
  # ---------------------------------------------------------------------------
  contract-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libharfbuzz-dev libsqlite3-dev zlib1g-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          modules: 'all'
          cache: true

      - name: Verify contract test tree is present
        run: |
          missing=0
          for f in \
            cmake/tests/run_all.sh \
            cmake/tests/test_mupdf_contract.sh \
            cmake/tests/test_sqlite_contract.sh \
            cmake/tests/test_install_contract.sh \
            cmake/tests/test_presets.sh \
            cmake/SioyekMupdf.cmake \
            cmake/SioyekSQLite.cmake \
            cmake/SioyekDependencies.cmake
          do
            if [[ ! -f "$f" ]]; then
              echo "::error file=$f::required file is missing on this branch"
              missing=1
            fi
          done
          if [[ $missing -ne 0 ]]; then
            echo "::error::This workflow requires a branch that contains the full cmake/ tree."
            exit 1
          fi

      - name: Run contract test scripts directly
        env:
          # Print per-case diagnostics whenever a contract case fails.
          SIOYEK_TEST_VERBOSE: "1"
        run: bash ./cmake/tests/run_all.sh

      - name: Configure (CTest registration)
        run: cmake -S . -B build/ci -DSIOYEK_USE_SYSTEM_MUPDF=OFF -DSIOYEK_ENABLE_TESTS=ON

      - name: Run contract tests via CTest
        run: ctest --test-dir build/ci --output-on-failure

  # ---------------------------------------------------------------------------
  # Real build: vendored mupdf, across a compiler matrix, plus a staged-install
  # smoke test. This is the route that catches link-time and command errors.
  # ---------------------------------------------------------------------------
  cmake-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: gcc,   cxx: g++   }
          - { cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libharfbuzz-dev libsqlite3-dev zlib1g-dev libjbig2dec0-dev \
            libjpeg-dev libopenjp2-7-dev libfreetype-dev libgumbo-dev \
            libgl1-mesa-dev
          if [ "${{ matrix.compiler.cc }}" = "clang" ]; then
            sudo apt-get install -y clang
          fi

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          modules: 'all'
          cache: true

      - name: Configure
        run: cmake --preset linux-ci

      - name: Build
        run: cmake --build --preset linux-ci -j"$(nproc)"

      - name: Staged install (verify install contract)
        run: |
          BUILD_DIR="$(bash cmake/tests/resolve_preset_bindir.sh linux-ci)"
          echo "build dir: ${BUILD_DIR}"
          DESTDIR="$PWD/stage" cmake --install "${BUILD_DIR}"

      - name: Verify installed layout
        run: |
          set -e
          test -x stage/usr/bin/sioyek
          test -f stage/usr/share/sioyek/tutorial.pdf
          test -d stage/usr/share/sioyek/shaders
          test -f stage/etc/sioyek/keys.config
          test -f stage/usr/share/applications/sioyek.desktop
          test -f stage/usr/share/pixmaps/sioyek-icon-linux.png
          test -f stage/usr/share/man/man1/sioyek.1

      - name: Smoke test (binary links resolve; no undefined symbols)
        run: |
          set -e
          BIN="$PWD/stage/usr/bin/sioyek"
          # ldd must not report "not found" for any dynamic dependency.
          if ldd "$BIN" | grep -q "not found"; then
            echo "::error::unresolved dynamic dependencies:"; ldd "$BIN" | grep "not found"; exit 1
          fi
          # The binary must load its shared libraries (will fail fast on missing libs).
          ldd "$BIN" >/dev/null
          # Running --version / --help should not crash (may exit non-zero w/o display).
          "$BIN" --help >/dev/null 2>&1 || true
          echo "smoke test passed"

      - name: Run contract tests via CTest
        run: |
          BUILD_DIR="$(bash cmake/tests/resolve_preset_bindir.sh linux-ci)"
          ctest --test-dir "${BUILD_DIR}" --output-on-failure

  # ---------------------------------------------------------------------------
  # Windows / MSVC preset validation.
  #
  # The `windows-release` / `windows-debug` presets were declared but never
  # exercised by any workflow (the release pipelines still call the legacy qmake
  # `build_windows.bat`). This job validates what the CMake path can actually do
  # on Windows today:
  #
  #   * the Visual Studio generator is Windows-only, so this is the only place
  #     the Windows CMake configure step can be checked at all;
  #   * the *vendored* mupdf route is not MSVC-buildable (mupdf's Windows build
  #     is a VS solution, not the POSIX Makefile this build drives), so this
  #     combination must stop at configure time with an actionable message. The
  #     job asserts that message instead of pretending to build it;
  #   * the presets themselves (generator, config mapping, build presets) are
  #     recognized by CMake.
  #
  # Producing a real Windows binary from the CMake path needs a system/prebuilt
  # mupdf (SIOYEK_USE_SYSTEM_MUPDF=ON) and is tracked separately.
  # ---------------------------------------------------------------------------
  windows-cmake-validate:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up MSVC (Visual Studio 2022 x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Toolchain versions
        run: cmake --version

      - name: The Windows presets are recognized by CMake
        run: |
          cmake --list-presets=build
          cmake --list-presets=build | Select-String -Pattern "windows-release","windows-debug"

      # The documented contract: vendored mupdf + MSVC fails fast at configure
      # time with a message that names the Windows mupdf build path. We assert
      # the *message* (not just a non-zero exit) so a future prebuilt-mupdf
      # change is noticed explicitly.
      - name: Vendored mupdf under MSVC fails with a clear diagnostic
        run: |
          $log = Join-Path $PWD "vendored-msvc.log"
          cmake --preset windows-release -DSIOYEK_USE_SYSTEM_MUPDF=OFF *>&1 |
            Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          $text = Get-Content $log -Raw
          if ($code -eq 0) {
            Write-Error "vendored mupdf + MSVC unexpectedly configured successfully"
            exit 1
          }
          if ($text -notmatch "vendored mupdf cannot be built with MSVC") {
            Write-Error "expected the MSVC/vendored-mupdf diagnostic"
            Get-Content $log | Select-Object -Last 40
            exit 1
          }
          if ($text -notmatch "mupdf.sln|Visual Studio solution") {
            Write-Error "diagnostic does not point at the Windows mupdf build path"
            exit 1
          }
          Write-Host "configure failed with the documented, actionable diagnostic"
